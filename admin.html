<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>THE EMPORIUM — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/site.css" />
</head>
<body>

  <section id="gate" class="gate">
    <div class="gate-box">
      <h1>THE EMPORIUM</h1>
      <p class="gate-sub">Admin sign in</p>
      <form id="gate-form">
        <input type="email" id="gate-email" class="gate-input" placeholder="Email address" autocomplete="email" required />
        <input type="password" id="gate-password" class="gate-input" placeholder="Password" autocomplete="current-password" required />
        <button type="submit" class="btn-primary">Sign in</button>
      </form>
      <p id="gate-error" class="gate-error" hidden>We could not sign you in. Check your email and password.</p>
      <p class="gate-note">Only authorised Emporium staff can manage the catalogue.</p>
      <a class="gate-back" href="index.html">&larr; Back to storefront</a>
    </div>
  </section>

  <div id="dashboard" hidden>
    <header class="admin-header">
      <h1>THE EMPORIUM — Admin</h1>
      <div class="admin-header-actions"><a href="index.html">View storefront</a><button id="sign-out" type="button" class="admin-sign-out">Sign out</button></div>
    </header>

    <section class="admin-section">
      <h2>Add product</h2>
      <form id="add-form" class="add-form">
        <input type="text" id="f-name" placeholder="Name" required />
        <input type="text" id="f-brand" placeholder="Brand (optional)" />
        <select id="f-category" required>
          <option value="" disabled selected>Category</option>
          <option value="teas">Teas</option>
          <option value="coffeehoney">Coffee &amp; Honey</option>
          <option value="oils">Oils &amp; Tonics</option>
          <option value="saltnuts">Salt, Nuts &amp; Botanicals</option>
          <option value="spices">Spices &amp; Dry Goods</option>
        </select>
        <input type="text" id="f-price" placeholder="Price (e.g. KES 650, leave blank for &quot;Contact for price&quot;)" />
        <input type="text" id="f-unit" placeholder="Unit (e.g. per kg, 120g pack)" />
        <input type="file" id="f-photo" accept="image/*" capture="environment" />
        <button type="submit" class="btn-primary">Add product</button>
        <p id="add-status" class="add-status"></p>
      </form>
    </section>

    <section class="admin-section">
      <h2>Products</h2>
      <div class="admin-filter">
        <select id="filter-category">
          <option value="all">All categories</option>
          <option value="teas">Teas</option>
          <option value="coffeehoney">Coffee &amp; Honey</option>
          <option value="oils">Oils &amp; Tonics</option>
          <option value="saltnuts">Salt, Nuts &amp; Botanicals</option>
          <option value="spices">Spices &amp; Dry Goods</option>
        </select>
      </div>
      <div id="product-list" class="product-list">
        <p class="status-message">Loading products…</p>
      </div>
    </section>
  </div>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
